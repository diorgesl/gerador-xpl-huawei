<script>
 function copiar(id) {
  // fora de origem segura (http servido de outra maquina) o navegador nao
  // tem navigator.clipboard, e a chamada crua derrubava o botao inteiro
  var alvo = document.getElementById(id);
  if (!alvo || !navigator.clipboard) return;
  navigator.clipboard.writeText(alvo.textContent);
  if (typeof event === "undefined" || !event.currentTarget) return;
  // o botao confirma que copiou: sem isso o operador clica de novo achando
  // que nao funcionou. currentTarget e lido aqui, antes do handler sair.
  var botao = event.currentTarget;
  var antes = botao.textContent;
  botao.textContent = "copiado";
  setTimeout(function () { botao.textContent = antes; }, 1200);
 }
</script>
